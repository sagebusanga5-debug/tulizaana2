    <script>
      /* Suppress Vite HMR WebSocket connection noise in proxy/iframe environment (HMR: Disabled) */
      (function() {
        try {
          var RealWS = window.WebSocket;
          if (typeof RealWS === 'function') {
            function DummyViteSocket() {
              var target = new EventTarget();
              target.readyState = 1;
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = '';
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              return target;
            }
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))
              ) {
                return DummyViteSocket();
              }
              return new RealWS(url, protocols);
            };
            window.WebSocket.prototype = RealWS.prototype;
            window.WebSocket.CONNECTING = RealWS.CONNECTING || 0;
            window.WebSocket.OPEN = RealWS.OPEN || 1;
            window.WebSocket.CLOSING = RealWS.CLOSING || 2;
            window.WebSocket.CLOSED = RealWS.CLOSED || 3;
          }

          var origError = console.error;
          console.error = function() {
            var first = arguments[0];
            if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('vite-hmr') !== -1)) {
              return;
            }
            return origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            var first = arguments[0];
            if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('vite-hmr') !== -1)) {
              return;
            }
            return origWarn.apply(console, arguments);
          };

          window.addEventListener('error', function(e) {
            if (e && e.message && typeof e.message === 'string' && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('vite-hmr') !== -1)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && String(e.reason).indexOf('[vite]') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);
        } catch (_) {}
      })();
    </script>
